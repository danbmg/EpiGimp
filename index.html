<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EpiGimp</title>
  </head>
  <body>
    <div class="app">
      <header id="menubar" class="menubar">
        <div class="menu">
          <button class="menu-title" aria-haspopup="true" aria-expanded="false">File</button>
          <ul class="menu-items" role="menu" hidden>
            <li><button role="menuitem" disabled>New…</button></li>
            <li><button role="menuitem" disabled>Open…</button></li>
            <li><button role="menuitem" disabled>Export…</button></li>
          </ul>
        </div>
      </header>

      <aside id="toolbar" class="panel toolbar">
        <button class="tool-button" data-tool="brush" title="Brush">Brush</button>
        <button class="tool-button" data-tool="eraser" title="Eraser">Eraser</button>
        <button class="tool-button" data-tool="eyedropper" title="Eyedropper: pick a color from the image">Picker</button>
        <label class="tool-field" title="Brush size in image pixels">
          Size
          <input id="brush-size" type="number" step="1" />
        </label>
        <label class="tool-field" title="Current color">
          Color
          <input id="brush-color" type="color" />
          <span id="brush-color-value" class="tool-color-value"></span>
        </label>
        <div class="tool-group">
          <button id="undo-button" class="tool-button" title="Undo (Ctrl+Z)">Undo</button>
          <button id="redo-button" class="tool-button" title="Redo (Ctrl+Y)">Redo</button>
        </div>
      </aside>

      <main id="canvas-area" class="canvas-area"></main>

      <aside id="layers-panel" class="panel layers-panel">
        <span class="placeholder">Layers</span>
      </aside>
    </div>

    <script type="module" src="/src/renderer/index.ts"></script>
  </body>
</html>
