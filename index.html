<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EpiGimp</title>
  </head>
  <body>
    <div class="app">
      <header id="menubar" class="menubar">
        <div class="menu">
          <button class="menu-title" aria-haspopup="true" aria-expanded="false">File</button>
          <ul class="menu-items" role="menu" hidden>
            <li><button role="menuitem" data-command="new">New…</button></li>
            <li><button role="menuitem" data-command="open">Open…</button></li>
            <li><button role="menuitem" data-command="export-png">Export as PNG…</button></li>
            <li><button role="menuitem" data-command="export-jpeg">Export as JPG…</button></li>
          </ul>
        </div>
        <div class="menu">
          <button class="menu-title" aria-haspopup="true" aria-expanded="false">Filters</button>
          <ul class="menu-items" role="menu" hidden>
            <li><button role="menuitem" data-command="grayscale">Grayscale</button></li>
            <li><button role="menuitem" data-command="invert">Invert</button></li>
            <li><button role="menuitem" data-command="brightness-contrast">Brightness / Contrast…</button></li>
            <li><button role="menuitem" data-command="blur">Blur…</button></li>
          </ul>
        </div>
      </header>

      <aside id="toolbar" class="panel toolbar">
        <button class="tool-button" data-tool="brush" title="Brush">Brush</button>
        <button class="tool-button" data-tool="eraser" title="Eraser">Eraser</button>
        <button class="tool-button" data-tool="eyedropper" title="Eyedropper: pick a color from the image">Picker</button>
        <label class="tool-field" title="Brush size in image pixels">
          Size
          <input id="brush-size" type="number" step="1" />
        </label>
        <label class="tool-field" title="Current color">
          Color
          <input id="brush-color" type="color" />
          <span id="brush-color-value" class="tool-color-value"></span>
        </label>
        <div class="tool-group">
          <button id="undo-button" class="tool-button" title="Undo (Ctrl+Z)">Undo</button>
          <button id="redo-button" class="tool-button" title="Redo (Ctrl+Y)">Redo</button>
        </div>
      </aside>

      <main id="canvas-area" class="canvas-area"></main>

      <aside id="layers-panel" class="panel layers-panel">
        <h2 class="panel-title">Layers</h2>
        <label class="layer-opacity" title="Opacity of the active layer">
          Opacity
          <input id="layer-opacity" type="range" min="0" max="100" step="1" />
          <span id="layer-opacity-value" class="layer-opacity-value"></span>
        </label>
        <ul id="layer-list" class="layer-list" role="listbox" aria-label="Layers, top first"></ul>
        <div class="layer-buttons">
          <button id="add-layer" class="tool-button" title="Add a layer above the active one">Add</button>
          <button id="delete-layer" class="tool-button" title="Delete the active layer">Delete</button>
        </div>
      </aside>
    </div>

    <dialog id="new-dialog" class="dialog">
      <form method="dialog">
        <h2 class="dialog-title">New image</h2>
        <label class="dialog-field">
          Width
          <input id="new-width" type="number" min="1" step="1" required />
          px
        </label>
        <label class="dialog-field">
          Height
          <input id="new-height" type="number" min="1" step="1" required />
          px
        </label>
        <div class="dialog-buttons">
          <button type="button" id="new-cancel">Cancel</button>
          <button value="create">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="filter-dialog" class="dialog">
      <form method="dialog">
        <h2 id="filter-title" class="dialog-title"></h2>
        <div id="filter-fields"></div>
        <div class="dialog-buttons">
          <button type="button" id="filter-cancel">Cancel</button>
          <button value="apply">Apply</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/renderer/index.ts"></script>
  </body>
</html>
